<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/index.html?redirected_from=%2F{{path}}">
    <script>
      (function() {
        var path = location.pathname + location.search + location.hash;
        var encoded = encodeURIComponent(path);
        var newUrl = '/index.html?redirected_from=' + encoded;
        location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
  
</html>
